name: Release

# Pushing a tag vX.Y.Z (matching the pom version) tests, signs and publishes to Maven Central,
# then creates the GitHub release from the CHANGELOG. Run manually for a dry run that tests,
# signs and checks the Central token without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    # Secrets live in this environment, which only accepts v* tags and main (for dry runs).
    environment: maven-central
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Check tag matches pom version
        if: github.event_name == 'push'
        run: |
          version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pom version $version"
            exit 1
          fi
          case "$version" in *-SNAPSHOT) echo "::error::Refusing to release a SNAPSHOT"; exit 1;; esac

      - name: Check Central token
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          # The Publisher API expects "Bearer base64(username:password)".
          token=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)
          status=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
            "https://central.sonatype.com/api/v1/publisher/published?namespace=com.daktela&name=daktela-v6-java-connector&version=0.0.0")
          if [ "$status" != "200" ]; then
            echo "::error::Central Portal rejected the token (HTTP $status)"
            exit 1
          fi

      - name: Dry run (test and sign, no upload)
        if: github.event_name == 'workflow_dispatch'
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -ntp -P release verify

      - name: Test, sign and publish
        if: github.event_name == 'push'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -ntp -P release deploy

  github-release:
    name: Create GitHub release
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, leaving it as is."
            exit 0
          fi
          # The section between "## [<version>]" and the next "## [" heading.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::No CHANGELOG.md section for $version"
            exit 1
          fi
          {
            echo
            echo '```xml'
            echo "<dependency>"
            echo "    <groupId>com.daktela</groupId>"
            echo "    <artifactId>daktela-v6-java-connector</artifactId>"
            echo "    <version>$version</version>"
            echo "</dependency>"
            echo '```'
          } >> notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "daktela-v6-java-connector $GITHUB_REF_NAME" \
            --notes-file notes.md
