version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: monthly
    ignore:
      # JUnit 6 requires Java 17; the library supports Java 11.
      - dependency-name: org.junit.jupiter:*
        versions: [">=6"]
